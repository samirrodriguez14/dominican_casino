name: dominican_casino
description: "Dominican Card Game"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  cupertino_icons: ^1.0.0
  dotted_border: ^2.1.0
  app_links: ^6.0.0
  share_plus: ^12.0.1
  rxdart: ^0.27.7
  firebase_messaging: ^16.1.1
  audioplayers: ^6.5.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.5

# audioplayers_darwin 6.4+ leaks AVPlayer status continuations on iOS
# (SWIFT TASK CONTINUATION MISUSE: setUpPlayerItemStatusObservation).
# See https://github.com/bluefireteam/audioplayers/issues/1982
dependency_overrides:
  audioplayers_darwin: 6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon_sage.png"
  remove_alpha_ios: true
