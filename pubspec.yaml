name: dominican_casino
description: "Dominican Card Game"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0-46.0.dev
dependency_overrides:
  firebase_core_platform_interface: 5.0.0 
dependencies:
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  cupertino_icons: ^1.0.0
  dotted_border: ^3.1.0
  app_links: ^7.0.0
  share_plus: ^12.0.1
  rxdart: ^0.28.0
  google_sign_in: ^7.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/logo_icon_wooden_transparent.png"
